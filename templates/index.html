<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8">Personal Expense Tracker</h1>
        
        <!-- Add Expense Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <form id="expenseForm" class="space-y-4">
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                    <input type="text" id="description" name="description" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                </div>
                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700">Amount ($)</label>
                    <input type="number" id="amount" name="amount" step="0.01" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                </div>
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                    <input type="text" id="category" name="category" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700">Add Expense</button>
            </form>
        </div>

        <!-- Expenses List -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Recent Expenses</h2>
            <div id="expensesList" class="space-y-4">
                <!-- Expenses will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script>
        async function loadExpenses() {
            const response = await fetch('/api/expenses');
            if (!response.ok) {
                const errorText = await response.text();
                console.error('API error:', errorText);
                return;
            }
            const expenses = await response.json();
            const expensesList = document.getElementById('expensesList');
            expensesList.innerHTML = '';

            // Group expenses by category
            const grouped = {};
            expenses.forEach(expense => {
                if (!grouped[expense.category]) grouped[expense.category] = [];
                grouped[expense.category].push(expense);
            });

            Object.keys(grouped).forEach(category => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'mb-6';
                categoryDiv.innerHTML = `<h3 class="text-lg font-bold mb-2">${category}</h3>`;

                grouped[category].forEach(expense => {
                    const expenseDiv = document.createElement('div');
                    expenseDiv.className = 'flex justify-between items-center p-4 bg-gray-50 rounded-md mb-2';
                    expenseDiv.innerHTML = `
                        <div>
                            <p class="font-medium">${expense.description}</p>
                            <p class="text-sm text-gray-500">${expense.date}</p>
                        </div>
                        <div class="flex items-center space-x-4">
                            <span class="font-medium">$${expense.amount.toFixed(2)}</span>
                            <button onclick="deleteExpense(${expense.id})" class="text-red-600 hover:text-red-800">Delete</button>
                        </div>
                    `;
                    categoryDiv.appendChild(expenseDiv);
                });

                expensesList.appendChild(categoryDiv);
            });
        }

        async function deleteExpense(id) {
            await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
            loadExpenses();
        }

        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const description = document.getElementById('description').value;
            const amount = document.getElementById('amount').value;
            const category = document.getElementById('category').value;

            await fetch('/api/expenses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ description, amount, category })
            });

            document.getElementById('expenseForm').reset();
            loadExpenses();
        });

        // Load expenses when page loads
        loadExpenses();
    </script>
</body>
</html>
