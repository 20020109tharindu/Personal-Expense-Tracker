<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
</head>
<body>
    <h1>Add Expense</h1>
    <form method="post">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required placeholder="YYYY-MM-DD"><br>
        <label for="category">Category:</label>
        <input type="text" id="category" name="category" required placeholder="e.g. Food"><br>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" step="0.01" required placeholder="e.g. 10.50"><br>
        <label for="description">Description:</label>
        <input type="text" id="description" name="description" placeholder="Optional details"><br>
        <input type="submit" value="Add">
    </form>
    <a href="{{ url_for('index') }}">Back to Expenses</a>
</body>
</html>
